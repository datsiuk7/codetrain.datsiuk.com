# Публікує на GitHub Pages лише файли гри та редактора.
# tests/, scratch/, server.cjs, README.md, AGENT.md на сайт не потрапляють.
# Settings → Pages → Build and deployment → Source має бути «GitHub Actions».
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: node --experimental-test-module-mocks --test --test-isolation=none tests/*.test.mjs

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html *.js *.mjs *.css CNAME _site/
          cp -r admin levels vendor _site/

      # One request for all levels instead of one per level (the game falls back to index.json locally).
      - name: Bundle levels
        run: |
          node -e "
            const fs = require('fs');
            const ids = JSON.parse(fs.readFileSync('levels/index.json', 'utf8'));
            const levels = ids.map((id) => JSON.parse(fs.readFileSync('levels/' + id + '.json', 'utf8')));
            fs.writeFileSync('_site/levels/all.json', JSON.stringify(levels));
            console.log('Bundled ' + levels.length + ' levels');
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
