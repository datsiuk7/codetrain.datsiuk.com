# Публікує на GitHub Pages лише файли гри та редактора.
# tests/, scratch/, server.cjs, README.md, AGENT.md на сайт не потрапляють.
# Settings → Pages → Build and deployment → Source має бути «GitHub Actions».
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: node --experimental-test-module-mocks --test --test-isolation=none tests/*.test.mjs

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html *.js *.mjs *.css *.png *.svg favicon.ico site.webmanifest CNAME robots.txt sitemap.xml _site/
          cp -r admin levels vendor _site/

      # One render-blocking stylesheet instead of four: same files, same order, same cascade.
      # Locally index.html keeps the separate files; the admin pages still use them on the site too.
      - name: Bundle styles
        run: |
          node -e "
            const fs = require('fs');
            const files = ['style.css', 'home.css', 'blocks.css', 'game.css'];
            let html = fs.readFileSync('_site/index.html', 'utf8');
            const version = html.match(/href=.style.css.(v[0-9.]+)/)[1];
            const tag = (f) => '  <link rel=\"stylesheet\" href=\"' + f + '?' + version + '\">\n';
            const missing = files.filter((f) => !html.includes(tag(f)));
            if (missing.length) throw new Error('index.html stylesheet links changed (' + missing + '): update the Bundle styles step');
            fs.writeFileSync('_site/site.css', files.map((f) => '/* ' + f + ' */\n' + fs.readFileSync(f, 'utf8')).join('\n'));
            html = html.replace(tag(files[0]), tag('site.css'));
            for (const f of files.slice(1)) html = html.replace(tag(f), '');
            fs.writeFileSync('_site/index.html', html);
            console.log('Bundled ' + files.length + ' stylesheets into site.css ' + version);
          "

      # One request for all levels instead of one per level (the game falls back to index.json locally).
      - name: Bundle levels
        run: |
          node -e "
            const fs = require('fs');
            const ids = JSON.parse(fs.readFileSync('levels/index.json', 'utf8'));
            const levels = ids.map((id) => JSON.parse(fs.readFileSync('levels/' + id + '.json', 'utf8')));
            fs.writeFileSync('_site/levels/all.json', JSON.stringify(levels));
            console.log('Bundled ' + levels.length + ' levels');
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
